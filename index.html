<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FocusRing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="card" id="card">
      <p class="eyebrow" id="modeLabel">Working</p>

      <div class="dial-wrap">
        <svg class="dial" viewBox="0 0 260 260">
          <circle class="dial-track" cx="130" cy="130" r="112"></circle>
          <circle class="dial-progress" id="progressRing" cx="130" cy="130" r="112"></circle>
        </svg>
        <div class="dial-center">
          <div class="time" id="timeDisplay">25:00</div>
          <div class="session-word" id="sessionWord">Session 1</div>
          <div class="edit-row" id="editRow">
            <label>Work
              <input id="workInput" type="number" min="1" max="90" value="25" aria-label="Work minutes">
            </label>
            <label>Break
              <input id="breakInput" type="number" min="1" max="30" value="5" aria-label="Break minutes">
            </label>
            <label>Long
              <input id="longInput" type="number" min="1" max="60" value="10" aria-label="Long break minutes">
            </label>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="startPauseBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="resetBtn">Reset</button>
      </div>

      <div class="seeds" id="seeds" aria-hidden="true"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
